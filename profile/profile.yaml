    git_url: "https://github.com/jarviscanada/jarvis_data_eng_BasilSyed/tree/develop/core_java"
    description: "Implemented a Java-based grep application to recursively search files using regex. Integrated logging, exception handling, and performance optimizations using Maven and SLF4J."

  - name: "Retail Data Analytics (Spark + Databricks)"
    git_url: "https://github.com/jarviscanada/jarvis_data_eng_BasilSyed/tree/develop/spark"
    description: "Developed a data analytics pipeline using Python, Pandas, and Apache Spark to analyze retail transaction datasets. Generated monthly sales trends, growth rates, and customer activity insights through data cleaning, transformation, and aggregation workflows."

  - name: "Azure SQL to Databricks ETL Pipeline"
    git_url: "https://github.com/jarviscanada/jarvis_data_eng_BasilSyed/tree/develop/spark"
    description: "Designed and implemented an end-to-end ETL pipeline using Python, Azure SQL, and Databricks. Ingested large-scale CSV datasets (~13M+ rows) into Azure SQL using batch processing, then connected Databricks via JDBC and Lakeflow Connect to load data into Delta tables. Performed data transformations using PySpark and SQL, built analytical queries, and developed dashboards for business insights. Orchestrated jobs and workflows within Databricks to automate ingestion and processing."

  - name: "Linux Cluster Monitoring System"
    git_url: "https://github.com/jarviscanada/jarvis_data_eng_BasilSyed/tree/develop/linux_sql"
    description: "Designed a monitoring system for a 10-node Linux cluster using Bash scripting and PostgreSQL. Automated hardware and usage data collection through scheduled jobs and stored metrics in a relational database for analysis and reporting."

